[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tatu"
version = "0.1.0"
description = "Encontra virtualenvs orfaos, grava o requirements.txt de cada projeto e remove os venvs para liberar espaco."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Luiz Fernando P. Quirino" }]
keywords = ["venv", "virtualenv", "cleanup", "requirements", "pip", "disk-space"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/luizfpq/tatu"
Repository = "https://github.com/luizfpq/tatu"
Issues = "https://github.com/luizfpq/tatu/issues"

[project.scripts]
tatu = "venv_tatu.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/venv_tatu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
